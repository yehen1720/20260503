<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カウンター</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #f7f4ef;
    }

    main {
      width: min(90vw, 360px);
      padding: 32px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      box-shadow: 0 18px 40px rgba(31, 41, 55, 0.12);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
      font-weight: 700;
    }

    .count {
      margin: 0 0 24px;
      font-size: 72px;
      line-height: 1;
      font-weight: 800;
      color: #0f766e;
      font-variant-numeric: tabular-nums;
    }

    button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-weight: 700;
      color: #ffffff;
      background: #0f766e;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease;
    }

    button:hover {
      background: #115e59;
    }

    button:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <main>
    <h1>カウンター</h1>
    <p class="count" id="count">0</p>
    <button type="button" id="countButton">カウントを増やす</button>
  </main>

  <script>
    const countDisplay = document.getElementById("count");
    const countButton = document.getElementById("countButton");
    let count = 0;

    countButton.addEventListener("click", () => {
      count += 1;
      countDisplay.textContent = count;
    });
  </script>
</body>
</html>
