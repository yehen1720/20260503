<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カウンター</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #f7f4ef;
    }

    main {
      position: relative;
      overflow: hidden;
      width: min(90vw, 360px);
      padding: 32px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      box-shadow: 0 18px 40px rgba(31, 41, 55, 0.12);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
      font-weight: 700;
    }

    .count {
      margin: 0 0 24px;
      font-size: 72px;
      line-height: 1;
      font-weight: 800;
      color: #0f766e;
      font-variant-numeric: tabular-nums;
    }

    button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-weight: 700;
      color: #ffffff;
      background: #0f766e;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease;
    }

    button:hover {
      background: #115e59;
    }

    button:active {
      transform: translateY(1px);
    }

    .effect {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
    }

    .effect.show {
      opacity: 1;
    }

    .spark {
      position: absolute;
      left: 50%;
      top: 44%;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--color);
      transform: translate(-50%, -50%);
    }

    .effect.show .spark {
      animation: burst 760ms ease-out forwards;
    }

    .spark:nth-child(1) {
      --x: 0px;
      --y: -92px;
      --color: #f97316;
    }

    .spark:nth-child(2) {
      --x: 72px;
      --y: -68px;
      --color: #0ea5e9;
    }

    .spark:nth-child(3) {
      --x: 96px;
      --y: 0px;
      --color: #14b8a6;
    }

    .spark:nth-child(4) {
      --x: 68px;
      --y: 72px;
      --color: #eab308;
    }

    .spark:nth-child(5) {
      --x: 0px;
      --y: 92px;
      --color: #ec4899;
    }

    .spark:nth-child(6) {
      --x: -68px;
      --y: 72px;
      --color: #8b5cf6;
    }

    .spark:nth-child(7) {
      --x: -96px;
      --y: 0px;
      --color: #ef4444;
    }

    .spark:nth-child(8) {
      --x: -72px;
      --y: -68px;
      --color: #22c55e;
    }

    @keyframes burst {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.2);
      }

      70% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.2);
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>カウンター</h1>
    <p class="count" id="count">0</p>
    <button type="button" id="countButton">カウントを増やす</button>
    <div class="effect" id="effect" aria-hidden="true">
      <span class="spark"></span>
      <span class="spark"></span>
      <span class="spark"></span>
      <span class="spark"></span>
      <span class="spark"></span>
      <span class="spark"></span>
      <span class="spark"></span>
      <span class="spark"></span>
    </div>
  </main>

  <script>
    const countDisplay = document.getElementById("count");
    const countButton = document.getElementById("countButton");
    const effect = document.getElementById("effect");
    let count = 0;

    countButton.addEventListener("click", () => {
      count += 1;
      countDisplay.textContent = count;

      if (count === 20) {
        effect.classList.remove("show");
        void effect.offsetWidth;
        effect.classList.add("show");
      }
    });

    effect.addEventListener("animationend", () => {
      effect.classList.remove("show");
    });
  </script>
</body>
</html>
